<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <!--
      Icone reali del prodotto. iOS ignora sia la favicon sia il manifest per la
      schermata Home: senza `apple-touch-icon` ripiega sull'iniziale su fondo
      colorato, che è il motivo per cui prima compariva una «S». Le icone sono
      quadrate e con fondo opaco: iOS ritaglia gli angoli e rende nera qualunque
      trasparenza. Favicon e icone manifest `any`, invece, mantengono il marchio
      trasparente per integrarsi pulitamente nelle schede e nei preferiti.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-schoolforge-32.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Nome sotto l'icona: senza questo iOS userebbe il <title>, troppo lungo. -->
    <meta name="apple-mobile-web-app-title" content="SchoolForge" />
    <title>SchoolForge — Portale Docente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
